<div class="swatches" role="radiogroup" aria-label="Solarpunk theme"{% if user.is_authenticated %} data-theme-url="{% url 'user_settings:set_theme' %}"{% endif %}>
  <button type="button" class="swatch" role="radio" data-swatch="aether" data-theme-set="aether" aria-label="Aether Atrium" title="Aether Atrium" aria-checked="{% if ui_theme == 'aether' %}true{% else %}false{% endif %}"></button>
  <button type="button" class="swatch" role="radio" data-swatch="terrace" data-theme-set="terrace" aria-label="Terrace Canopy" title="Terrace Canopy" aria-checked="{% if ui_theme == 'terrace' %}true{% else %}false{% endif %}"></button>
  <button type="button" class="swatch" role="radio" data-swatch="mist" data-theme-set="mist" aria-label="Mist Conservatory" title="Mist Conservatory" aria-checked="{% if ui_theme == 'mist' %}true{% else %}false{% endif %}"></button>
</div>
