<div class="swatches" role="radiogroup" aria-label="Theme"{% if user.is_authenticated %} data-theme-url="{% url 'user_settings:set_theme' %}"{% endif %}>
  <button type="button" class="swatch" role="radio" data-swatch="kyoto" data-theme-set="kyoto" aria-label="Kyoto Moss" title="Kyoto Moss" aria-checked="{% if ui_theme == 'kyoto' %}true{% else %}false{% endif %}"></button>
  <button type="button" class="swatch" role="radio" data-swatch="shiroi" data-theme-set="shiroi" aria-label="Shiroi Stone" title="Shiroi Stone" aria-checked="{% if ui_theme == 'shiroi' %}true{% else %}false{% endif %}"></button>
  <button type="button" class="swatch" role="radio" data-swatch="hinoki" data-theme-set="hinoki" aria-label="Hinoki Sand" title="Hinoki Sand" aria-checked="{% if ui_theme == 'hinoki' %}true{% else %}false{% endif %}"></button>
</div>
