<div class="sun-pills" role="radiogroup" aria-label="Time of day">
  <button type="button" class="pill" role="radio" data-sun-set="auto" aria-checked="true">Auto <small>live sun</small></button>
  <button type="button" class="pill" role="radio" data-sun-set="dawn" aria-checked="false">Dawn</button>
  <button type="button" class="pill" role="radio" data-sun-set="day" aria-checked="false">Day</button>
  <button type="button" class="pill" role="radio" data-sun-set="golden" aria-checked="false">Golden hour</button>
  <button type="button" class="pill" role="radio" data-sun-set="night" aria-checked="false">Night</button>
</div>
