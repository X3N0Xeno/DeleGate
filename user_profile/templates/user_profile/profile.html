{% extends 'base.html' %}

{% block title %}User Profile | DeleGate{% endblock %}

{% block content %}
<div class="card">
  <h2>Account Profile</h2>
  <form method="POST" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-width: 500px;">
    {% csrf_token %}
    <div>
      <label style="display:block; margin-bottom: 0.25rem; color: var(--text-muted);">Username</label>
      <input type="text" value="{{ user.username }}" disabled style="width: 100%; padding: 0.5rem; background: var(--bg-dark); color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 4px;">
    </div>
    <div>
      <label style="display:block; margin-bottom: 0.25rem; color: var(--text-muted);">Role Title</label>
      <input type="text" name="role_title" value="{{ profile.role_title }}" style="width: 100%; padding: 0.5rem; background: var(--bg-dark); color: #fff; border: 1px solid var(--border-color); border-radius: 4px;">
    </div>
    <div>
      <label style="display:block; margin-bottom: 0.25rem; color: var(--text-muted);">Bio</label>
      <textarea name="bio" rows="4" style="width: 100%; padding: 0.5rem; background: var(--bg-dark); color: #fff; border: 1px solid var(--border-color); border-radius: 4px;">{{ profile.bio }}</textarea>
    </div>
    <button type="submit" class="btn-orange" style="align-self: flex-start;">Save Profile</button>
  </form>
</div>
{% endblock %}
