[package]
name = "rune_client"
version = "0.1.0"
edition = "2021"
description = "Lightweight Solarpunk CLI companion client for DeleGate Stage-Gate task mining"
authors = ["X3N0 <dev@delegate.local>"]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
